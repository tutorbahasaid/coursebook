<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coursebook · Satu Langkah</title>
<meta name="theme-color" content="#6b3f1d">
<style>
  :root{
    --cream:#f8f3e8; --paper:#fffdf7; --brown:#6b3f1d; --brown-dark:#4a2a11;
    --gold:#c98a3a; --gold-soft:#e8c98f; --green:#5b7f47; --green-soft:#dfead4;
    --red:#b0413e; --red-soft:#f5dcdb; --ink:#2b1d0e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    font-family:system-ui,-apple-system,sans-serif;
    background:var(--cream); color:var(--ink); min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 15% 10%, rgba(201,138,58,0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(91,127,71,0.07) 0%, transparent 40%),
      var(--cream);
  }

  .container{
    max-width:560px; width:100%;
    background:var(--paper);
    border-radius:20px;
    padding:40px 28px 32px;
    text-align:center;
    box-shadow:0 20px 40px -20px rgba(74,42,17,.35), 0 0 0 1px rgba(107,63,29,.06);
    position:relative;
    overflow:hidden;
  }
  .container::before{
    content:'';
    position:absolute; top:0; left:20px; right:20px; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold), var(--green), var(--gold), transparent);
    border-radius:0 0 3px 3px;
  }

  .logo{
    font-size:48px; line-height:1; margin-bottom:12px;
    display:inline-block;
    animation:float 3s ease-in-out infinite;
    filter:drop-shadow(0 6px 12px rgba(201,138,58,.25));
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-5deg);}
    50%{transform:translateY(-6px) rotate(5deg);}
  }

  .eyebrow{
    font-size:11px; font-weight:600; letter-spacing:.15em;
    text-transform:uppercase; color:var(--gold); margin-bottom:8px;
  }
  h1{
    font-family:Georgia,serif; font-size:28px; line-height:1.2;
    color:var(--brown-dark); margin-bottom:14px;
  }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--green-soft); color:var(--green);
    padding:6px 14px; border-radius:999px;
    font-size:12px; font-weight:700;
    margin-bottom:24px;
  }
  .badge::before{
    content:'✓';
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%;
    background:var(--green); color:#fff; font-size:10px;
  }

  p{
    font-size:14px; color:#5b4a33; line-height:1.6; margin-bottom:8px;
  }
  p strong{color:var(--brown-dark); font-weight:700;}

  .placeholder{
    font-size:12px; color:#a99a7d; font-style:italic;
    margin-bottom:28px;
    padding:12px;
    background:var(--cream);
    border-radius:10px;
    border-left:3px solid var(--gold-soft);
    text-align:left;
  }

  .logout{
    display:inline-flex; align-items:center; gap:6px;
    padding:12px 22px; border-radius:10px;
    background:#fff; border:1.5px solid #e8dfcd;
    color:var(--brown); font-family:inherit; font-size:14px;
    font-weight:600; cursor:pointer;
    transition:all .15s ease;
  }
  .logout:hover{
    border-color:var(--gold);
    transform:translateY(-1px);
    box-shadow:0 4px 10px -4px rgba(107,63,29,.15);
  }
  .logout:active{transform:translateY(0);}

  .footer{
    margin-top:32px; padding-top:20px;
    border-top:1px solid #e8dfcd;
    font-size:11px; color:#8a7a5c;
    line-height:1.6;
  }
  .footer .licensed{
    font-size:11px;
    color:#a99a7d;
  }
  .footer .licensed strong{
    color:var(--brown);
    font-weight:700;
  }
  .footer .code{
    font-family:'SF Mono','Monaco','Consolas',monospace;
    font-size:10px;
    letter-spacing:.5px;
    color:#a99a7d;
    margin-top:2px;
    display:block;
  }

  @media (max-width:420px){
    .container{padding:32px 20px 24px; border-radius:16px;}
    .logo{font-size:40px;}
    h1{font-size:24px;}
    p{font-size:13px;}
    .placeholder{font-size:11px; padding:10px;}
    .logout{padding:11px 18px; font-size:13px;}
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">🐝</div>
  <div class="eyebrow">Satu Langkah · Coursebook</div>
  <h1>Welcome!</h1>
  <div class="badge">Authenticated</div>

  <p>Hi <strong id="user-name">Learner</strong>!</p>

  <div class="placeholder">
    📘 Chapter 2–5 will appear here once the coursebook content is built.<br>
    <em>(This is currently a placeholder page)</em>
  </div>

  <button class="logout" id="btn-logout">
    ← Logout
  </button>

  <div class="footer">
    <div class="licensed">
      Licensed to <strong id="footer-name">Learner</strong>
    </div>
    <span class="code" id="footer-code">—</span>
    <div style="margin-top:12px;">© 2026 Tutor Bahasa · Satu Langkah</div>
  </div>
</div>

<script src="auth.js"></script>
<script>
(async function () {
  'use strict';

  // ---------- 1. Require auth (redirect to unlock if not logged in) ----------
  const session = await SLAuth.requireAuth('unlock.html');
  if (!session) return;

  // ---------- 2. Fallback: fetch name from codes.json if missing ----------
  // This handles old sessions where name wasn't saved properly
  if (!session.name) {
    try {
      const res = await fetch('codes.json?v=' + Date.now(), { cache: 'no-store' });
      if (res.ok) {
        const codes = await res.json();
        const entry = codes[session.code];
        if (entry && entry.name) {
          session.name = entry.name;
          SLAuth.saveSession(session.code, entry.name);
        }
      }
    } catch (e) {
      console.warn('Could not fetch name from codes.json:', e);
    }
  }

  // ---------- 3. Display user info ----------
  const displayName = session.name || 'Learner';

  const userNameEl = document.getElementById('user-name');
  const footerNameEl = document.getElementById('footer-name');
  const footerCodeEl = document.getElementById('footer-code');

  if (userNameEl) userNameEl.textContent = displayName;
  if (footerNameEl) footerNameEl.textContent = displayName;
  if (footerCodeEl) footerCodeEl.textContent = session.code || '—';

  // Also update document title for tab clarity
  document.title = 'Welcome, ' + displayName + ' · Satu Langkah';

  // ---------- 4. Logout handler ----------
  const logoutBtn = document.getElementById('btn-logout');
  if (logoutBtn) {
    logoutBtn.onclick = () => {
      const confirmed = confirm(
        'Log out from this device?\n\n' +
        'You will need your access code again to re-enter the coursebook.\n' +
        'Your progress will NOT be lost.'
      );
      if (confirmed) {
        SLAuth.clearSession();
        window.location.href = 'unlock.html';
      }
    };
  }
})();
</script>
</body>
</html>
